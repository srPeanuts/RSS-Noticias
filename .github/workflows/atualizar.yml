permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recolher e analisar notícias
        run: python scripts/atualizar.py

      - name: Guardar resultados
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add dados docs/data
          git diff --cached --quiet || git commit -m "Atualização $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push

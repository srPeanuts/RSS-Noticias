name: Resumo diario por email
on:
  workflow_run:
    workflows: ["Atualizar noticias"]
    types: [completed]
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  enviar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dia em Lisboa
        id: dia
        run: echo "data=$(TZ=Europe/Lisbon date +%F)" >> "$GITHUB_OUTPUT"
      - name: Ja enviamos o resumo hoje?
        id: marcador
        uses: actions/cache@v4
        with:
          path: .email-enviado
          key: resumo-email-${{ steps.dia.outputs.data }}
      - name: Enviar resumo
        id: enviar
        if: steps.marcador.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/enviar_email.py
        env:
          EMAIL_UTILIZADOR: ${{ secrets.EMAIL_UTILIZADOR }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          EMAIL_SMTP: ${{ secrets.EMAIL_SMTP }}
          EMAIL_PORTA: ${{ secrets.EMAIL_PORTA }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Marcar envio do dia
        if: steps.enviar.outputs.enviado == 'true'
        run: echo enviado > .email-enviado

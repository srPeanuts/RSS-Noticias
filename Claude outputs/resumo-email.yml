{
"name": "Resumo diario por email",
"on": { "schedule": [ { "cron": "20 7 * * *" } ], "workflow_dispatch": {}, "push": { "branches": [ "teste-novidades" ] } },
"permissions": { "contents": "read" },
"jobs": { "enviar": {
"runs-on": "ubuntu-latest",
"steps": [
{ "uses": "actions/checkout@v5" },
{ "uses": "actions/setup-python@v6", "with": { "python-version": "3.12" } },
{ "name": "Enviar resumo", "run": "python scripts/enviar_email.py",
  "env": {
    "EMAIL_UTILIZADOR": "${{ secrets.EMAIL_UTILIZADOR }}",
    "EMAIL_PASSWORD": "${{ secrets.EMAIL_PASSWORD }}",
    "EMAIL_PARA": "${{ secrets.EMAIL_PARA }}",
    "EMAIL_SMTP": "${{ secrets.EMAIL_SMTP }}",
    "EMAIL_PORTA": "${{ secrets.EMAIL_PORTA }}",
    "SITE_URL": "${{ vars.SITE_URL }}"
  } }
]
} }
}
